name: Live Data Pipelines (10 Min)

on:
  schedule:
    # Every 10 min, Mon-Fri, during IST market hours (UTC ~4:00-10:00)
    - cron: '*/10 4-10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: blamics-live-data
  cancel-in-progress: false

jobs:
  live-scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Global Indices Pipeline
        continue-on-error: true
        run: |
          cd global_indices
          python run.py

      - name: Run Market Breadth Pipeline
        continue-on-error: true
        run: |
          cd market_breadth
          python run.py

      - name: Run IPO Pipeline
        continue-on-error: true
        run: |
          cd scraper
          python run.py

      - name: Run Sector Performance Pipeline
        continue-on-error: true
        run: |
          cd scraper
          python sector_performance.py

      - name: Run Market Sentiment Pipeline
        continue-on-error: true
        run: |
          cd scraper
          python market_sentiment.py

      - name: Run 52-Week High/Low Pipeline
        continue-on-error: true
        run: |
          cd scraper
          python high_low.py

      - name: Run Commodities Pipeline
        continue-on-error: true
        run: |
          cd scraper
          python commodities.py

      - name: Run Currency Pipeline
        continue-on-error: true
        run: |
          cd scraper
          python currency.py

      - name: Run Volume Shocker Pipeline
        continue-on-error: true
        run: |
          cd scraper
          python volume_shocker.py

      - name: Run 10%+ Circuit Breakers Pipeline
        continue-on-error: true
        run: |
          cd scraper
          python circuit_breakers.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "chore(data): auto-update live data and health" || echo "No changes to commit"
          git push

      - name: Check Health
        run: |
          if grep -q '"status": "failed"' data/health.json; then
            echo "One or more pipelines failed!"
            exit 1
          fi

      - name: Create Issue on Failure
        if: failure()
        uses: dacbd/create-issue-action@main
        with:
          token: ${{ github.token }}
          title: "🚨 Live Data Pipeline Failure"
          body: "A live scraper pipeline failed. Please check the workflow logs."
          assignees: "${{ github.actor }}"
