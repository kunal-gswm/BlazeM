name: Daily Data Pipelines (EOD)

on:
  schedule:
    # Runs every hour from 13:00 to 16:00 UTC (18:30 to 21:30 IST) daily
    - cron: '0 13-16 * * *'
  workflow_dispatch:

concurrency:
  group: blamics-daily-data
  cancel-in-progress: false

jobs:
  daily-scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FII/DII Pipeline
        continue-on-error: true
        run: |
          cd fii_dii
          python run.py

      - name: Run Corporate Actions Pipeline
        continue-on-error: true
        run: |
          cd corporate_actions
          python run.py

      - name: Run Earnings Calendar Pipeline
        continue-on-error: true
        run: |
          cd earnings_calendar
          python run.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "chore(data): auto-update daily data and health" || echo "No changes to commit"
          git push

      - name: Check Health
        run: |
          if grep -q '"status": "failed"' data/health.json; then
            echo "One or more pipelines failed!"
            exit 1
          fi

      - name: Create Issue on Failure
        if: failure()
        uses: dacbd/create-issue-action@main
        with:
          token: ${{ github.token }}
          title: "🚨 Daily Data Pipeline Failure"
          body: "A daily scraper pipeline failed. Please check the workflow logs."
          assignees: "${{ github.actor }}"
